# Strong cabinet cabinet_strong: scenes/cabinet.yml with every panel 5 x as thick (0.1 m) and every compartment
# the same size inside. Written by jeffrey/joint_range/make_strong.py; do not edit by hand.
# Cupboard (open towards the robot, -X): outer box x 0.56-0.96, y 0.05-0.61, z -0.035-0.905,
# 0.1 m panels. Three compartments 0.3 deep x 0.36 wide (y 0.15-0.51): bottom z -0.035-0.19, middle z 0.29-0.5, top z 0.6-0.805.
# Unchanged from cabinet.yml: table, opening, floor, centre line, every compartment interior size; the bottom
# compartment is in the same place, the middle one 0.08 m and the top one 0.16 m higher (thicker boards below them).
#
# Sampling box for the grasp point, from the cupboard's outer box:
#   height = cupboard height = 0.94  z -0.035-0.905
#   width  = 1.5 x 0.56 = 0.84  y -0.09-0.75 (centred on the cupboard)
#   depth  = 2.5 x 0.4 from the back face, but not closer to the robot than x 0.08  x 0.08-0.96
#
# No task orientation: no zones or task_axes. Speed is clearance only.

cuboids:
  - name: table
    pose: [0.65, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
    dims: [0.8, 1.2, 0.05]

  - name: shelf_back
    pose: [0.91, 0.33, 0.435, 1.0, 0.0, 0.0, 0.0]
    dims: [0.1, 0.56, 0.94]
    color: [150, 105, 60]

  - name: shelf_side_inner
    pose: [0.71, 0.1, 0.435, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.1, 0.94]
    color: [150, 105, 60]

  - name: shelf_side_outer
    pose: [0.71, 0.56, 0.435, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.1, 0.94]
    color: [150, 105, 60]

  - name: shelf_top
    pose: [0.71, 0.33, 0.855, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.36, 0.1]
    color: [150, 105, 60]

  - name: shelf_board_low
    pose: [0.71, 0.33, 0.24, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.36, 0.1]
    color: [170, 125, 75]

  - name: shelf_board_high
    pose: [0.71, 0.33, 0.55, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.36, 0.1]
    color: [170, 125, 75]

viz_table:
  name: viz_tabletop
  pose: [0.75, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
  dims: [1.0, 1.2, 0.05]

sampling:
  x: [0.08, 0.96]
  y: [-0.09, 0.75]
  z: [-0.035, 0.905]
  rule: height = cupboard, width = 1.5 x, depth = 2.5 x from the back face, x >= 0.08

# Grasp-point boxes of the compartment interiors (0.04 m past the opening). Used by the test suites and the coverage strata.
compartments:
  - name: bottom
    x: [0.6, 0.86]
    y: [0.15, 0.51]
    z: [-0.035, 0.19]
  - name: middle
    x: [0.6, 0.86]
    y: [0.15, 0.51]
    z: [0.29, 0.5]
  - name: top
    x: [0.6, 0.86]
    y: [0.15, 0.51]
    z: [0.6, 0.805]

# Derivation (jeffrey/joint_range/make_strong.py); not read by the runtime.
variant:
  base: cabinet.yml
  clearance_scale: 1.0
  panel_scale: 5
  rule: every panel panel_scale x as thick, every compartment interior the same size; panels grow outward from the interiors (opening, floor, centre line fixed; compartments stacked from the floor)
