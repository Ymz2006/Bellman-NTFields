viz_table:
  name: viz_tabletop
  pose: [0.75, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
  dims: [1.0, 1.2, 0.05]

# Grasp-point sampling box: the square around the robot, z from the table top to the cupboard top.
sampling:
  x: [-0.96, 0.96]
  y: [-0.96, 0.96]
  z: [-0.035, 0.905]
  rule: the three cupboards and the strip behind the robot (x >= -0.96); z = cupboard height

# The region that takes the cupboard's place in the coverage strata and the test regions: the bounding box of the three cupboards.
focus:
  x: [-0.46, 0.96]
  y: [-0.96, 0.96]
  z: [-0.035, 0.905]

# Grasp-point boxes of the nine compartment interiors (0.04 m past each opening).
compartments:
  - name: bottom_px
    x: [0.6, 0.86]
    y: [-0.36, 0.36]
    z: [-0.035, 0.19]
  - name: middle_px
    x: [0.6, 0.86]
    y: [-0.36, 0.36]
    z: [0.29, 0.5]
  - name: top_px
    x: [0.6, 0.86]
    y: [-0.36, 0.36]
    z: [0.6, 0.805]
  - name: bottom_py
    x: [-0.51, 0.21]
    y: [0.6, 0.86]
    z: [-0.035, 0.19]
  - name: middle_py
    x: [-0.51, 0.21]
    y: [0.6, 0.86]
    z: [0.29, 0.5]
  - name: top_py
    x: [-0.51, 0.21]
    y: [0.6, 0.86]
    z: [0.6, 0.805]
  - name: bottom_ny
    x: [-0.21, 0.51]
    y: [-0.86, -0.6]
    z: [-0.035, 0.19]
  - name: middle_ny
    x: [-0.21, 0.51]
    y: [-0.86, -0.6]
    z: [0.29, 0.5]
  - name: top_ny
    x: [-0.21, 0.51]
    y: [-0.86, -0.6]
    z: [0.6, 0.805]

# Derivation (jeffrey/easy_cabinet/make_square.py); not read by the runtime.
variant:
  base: cabinet_easy.yml
  clearance_scale: 1.0
  copies: [px, py, ny]
  rule: three copies of the easy cupboard, lateral centre 0, open towards the robot at +x, +y (turned +90 deg) and -y (turned -90 deg); table slabs under each; focus = bounding box of the three
