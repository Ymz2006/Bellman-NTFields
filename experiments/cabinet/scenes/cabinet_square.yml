# Square scene cabinet_square: three easy cupboards (cabinet_easy: 2 x wide compartments, 0.10 m panels) around the robot at +x, +y, -y,
# each centred on its axis and open towards the robot; one table slab under each. Written by jeffrey/easy_cabinet/make_square.py; do not edit by hand.
# Home cupboard (+x) outer box: x 0.56-0.96, y -0.46-0.46, z -0.035-0.905; the others are its 90 deg turns.
# No task orientation: no zones or task_axes. Speed is clearance only.

