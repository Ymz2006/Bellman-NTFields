# Cabinet task with 10% more clearance: scenes/cabinet.yml with every compartment opening
# 1.1 x as wide and each compartment 1.1 x as tall. Written by make_scenes.py; do not edit by hand.
# Cupboard (open towards the robot, -X): outer box x 0.56-0.88, y 0.112-0.548, z -0.035-0.729,
# 0.02 m panels. Three compartments 0.3 deep x 0.396 wide (y 0.132-0.528), bottom 0.2475 tall, middle 0.231 tall, top 0.2255 tall.
# Unchanged from cabinet.yml: table, panel thickness, floor, centre line, back face, depth.
#
# Sampling box for the grasp point, from the cupboard's outer box:
#   height = cupboard height = 0.764  z -0.035-0.729 (FK sampler: table top + --height 0.764)
#   width  = 1.5 x 0.436 = 0.654  y 0.003-0.657 (centred on the cupboard)
#   depth  = 2.5 x 0.32 = 0.8  x 0.08-0.88 (back face of the cupboard towards the robot)
#
# No task orientation: no zones or task_axes. Speed is clearance only.

cuboids:
  - name: table
    pose: [0.65, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
    dims: [0.8, 1.2, 0.05]

  - name: shelf_back
    pose: [0.87, 0.33, 0.347, 1.0, 0.0, 0.0, 0.0]
    dims: [0.02, 0.436, 0.764]
    color: [150, 105, 60]

  - name: shelf_side_inner
    pose: [0.71, 0.122, 0.347, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.02, 0.764]
    color: [150, 105, 60]

  - name: shelf_side_outer
    pose: [0.71, 0.538, 0.347, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.02, 0.764]
    color: [150, 105, 60]

  - name: shelf_top
    pose: [0.71, 0.33, 0.719, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.396, 0.02]
    color: [150, 105, 60]

  - name: shelf_board_low
    pose: [0.71, 0.33, 0.2225, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.396, 0.02]
    color: [170, 125, 75]

  - name: shelf_board_high
    pose: [0.71, 0.33, 0.4735, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.396, 0.02]
    color: [170, 125, 75]

viz_table:
  name: viz_tabletop
  pose: [0.75, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
  dims: [1.0, 1.2, 0.05]

# The frozen FK sampler reads x and y; z is recorded for the other stages and checked against it.
sampling:
  x: [0.08, 0.88]
  y: [0.003, 0.657]
  z: [-0.035, 0.729]

# Grasp-point boxes of the compartment interiors (0.04 m past the opening). Used by the test suites and the coverage strata.
compartments:
  - name: bottom
    x: [0.6, 0.86]
    y: [0.132, 0.528]
    z: [-0.035, 0.2125]
  - name: middle
    x: [0.6, 0.86]
    y: [0.132, 0.528]
    z: [0.2325, 0.4635]
  - name: top
    x: [0.6, 0.86]
    y: [0.132, 0.528]
    z: [0.4835, 0.709]

# Derivation (make_scenes.py); not read by the runtime.
variant:
  base: cabinet.yml
  clearance_scale: 1.1
  rule: each compartment opening clearance_scale x as wide and each compartment clearance_scale x as tall; panels, floor, centre line, back face and depth unchanged
