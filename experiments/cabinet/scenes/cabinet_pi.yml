# Cabinet task in ntrl-demo's joint domain: scenes/cabinet.yml unchanged (same cuboids, sampling box and
# compartments) plus `joint_limit`: every joint |q| <= pi, as ntrl-demo samples its arm (IK joint limits +-pi).
# Used by experiments/ntrl_cabinet/make_tests_pi.py (suites in tests_pi/) and data.py --joint-limit.
# Cabinet motion-planning task: the table plus the standing cupboard of
# experiments/obstacle_scenes/scenes/shelf.yml, cuboids copied verbatim. Nothing else.
# Cupboard (open towards the robot, -X): outer box x 0.56-0.88, y 0.13-0.53, z -0.035-0.665,
# 0.02 m panels. Three compartments 0.30 deep x 0.36 wide (y 0.15-0.51):
#   bottom z -0.035-0.19 (floor = table top), middle z 0.21-0.42, top z 0.44-0.645.
# The table stays: it is the cupboard's floor and the frozen FK sampler requires it.
#
# Sampling box for the grasp point, from the cupboard's outer box:
#   height = cupboard height    z -0.035-0.665 (FK sampler: table top + --height 0.70)
#   width  = 1.5 x 0.40 = 0.60  y 0.03-0.63 (centred on the cupboard)
#   depth  = 2.5 x 0.32 = 0.80  x 0.08-0.88 (back face of the cupboard towards the robot)
#
# No task orientation: no zones or task_axes. Speed is clearance only.

cuboids:
  - name: table
    pose: [0.65, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
    dims: [0.80, 1.20, 0.05]

  - name: shelf_back
    pose: [0.87, 0.33, 0.315, 1.0, 0.0, 0.0, 0.0]
    dims: [0.02, 0.40, 0.70]
    color: [150, 105, 60]

  - name: shelf_side_inner
    pose: [0.71, 0.14, 0.315, 1.0, 0.0, 0.0, 0.0]
    dims: [0.30, 0.02, 0.70]
    color: [150, 105, 60]

  - name: shelf_side_outer
    pose: [0.71, 0.52, 0.315, 1.0, 0.0, 0.0, 0.0]
    dims: [0.30, 0.02, 0.70]
    color: [150, 105, 60]

  - name: shelf_top
    pose: [0.71, 0.33, 0.655, 1.0, 0.0, 0.0, 0.0]
    dims: [0.30, 0.36, 0.02]
    color: [150, 105, 60]

  - name: shelf_board_low
    pose: [0.71, 0.33, 0.20, 1.0, 0.0, 0.0, 0.0]
    dims: [0.30, 0.36, 0.02]
    color: [170, 125, 75]

  - name: shelf_board_high
    pose: [0.71, 0.33, 0.43, 1.0, 0.0, 0.0, 0.0]
    dims: [0.30, 0.36, 0.02]
    color: [170, 125, 75]

viz_table:
  name: viz_tabletop
  pose: [0.75, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
  dims: [1.00, 1.20, 0.05]

# The frozen FK sampler reads x and y; z is recorded for the other stages and checked against it.
sampling:
  x: [0.08, 0.88]
  y: [0.03, 0.63]
  z: [-0.035, 0.665]

# Grasp-point boxes of the compartment interiors (0.04 m past the opening, as in
# obstacle_scenes/targets.yml). Used by the test suites and the coverage strata.
compartments:
  - name: bottom
    x: [0.60, 0.86]
    y: [0.15, 0.51]
    z: [-0.035, 0.19]
  - name: middle
    x: [0.60, 0.86]
    y: [0.15, 0.51]
    z: [0.21, 0.42]
  - name: top
    x: [0.60, 0.86]
    y: [0.15, 0.51]
    z: [0.44, 0.645]

joint_limit: 3.141592653589793

variant:
  base: cabinet.yml
  clearance_scale: 1.0
  rule: cabinet.yml geometry; every joint restricted to |q| <= joint_limit (ntrl-demo joint domain)
