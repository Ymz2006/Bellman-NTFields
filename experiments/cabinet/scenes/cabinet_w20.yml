# Larger cabinet cabinet_w20: scenes/cabinet.yml with every compartment opening 2.0 x as wide and each compartment
# 1.25 x as tall, centre line moved to y 0.15. Written by experiments/ntrl_cabinet/make_scenes.py; do not edit by hand.
# Cupboard (open towards the robot, -X): outer box x 0.56-0.88, y -0.23-0.53, z -0.035-0.825,
# 0.02 m panels. Three compartments 0.3 deep x 0.72 wide (y -0.21-0.51), bottom 0.28125 tall, middle 0.2625 tall, top 0.25625 tall.
# Unchanged from cabinet.yml: table, panel thickness, floor, back face, depth.
#
# Sampling box for the grasp point, from the cupboard's outer box:
#   height = cupboard height = 0.86  z -0.035-0.825 (FK sampler: table top + --height 0.86)
#   width  = 1.5 x 0.76 = 1.14  y -0.42-0.72 (centred on the cupboard)
#   depth  = 2.5 x 0.32 = 0.8  x 0.08-0.88 (back face of the cupboard towards the robot)
#
# No task orientation: no zones or task_axes. Speed is clearance only.

cuboids:
  - name: table
    pose: [0.65, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
    dims: [0.8, 1.2, 0.05]

  - name: shelf_back
    pose: [0.87, 0.15, 0.395, 1.0, 0.0, 0.0, 0.0]
    dims: [0.02, 0.76, 0.86]
    color: [150, 105, 60]

  - name: shelf_side_inner
    pose: [0.71, -0.22, 0.395, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.02, 0.86]
    color: [150, 105, 60]

  - name: shelf_side_outer
    pose: [0.71, 0.52, 0.395, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.02, 0.86]
    color: [150, 105, 60]

  - name: shelf_top
    pose: [0.71, 0.15, 0.815, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.72, 0.02]
    color: [150, 105, 60]

  - name: shelf_board_low
    pose: [0.71, 0.15, 0.25625, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.72, 0.02]
    color: [170, 125, 75]

  - name: shelf_board_high
    pose: [0.71, 0.15, 0.53875, 1.0, 0.0, 0.0, 0.0]
    dims: [0.3, 0.72, 0.02]
    color: [170, 125, 75]

viz_table:
  name: viz_tabletop
  pose: [0.75, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
  dims: [1.0, 1.2, 0.05]

# The frozen FK sampler reads x and y; z is recorded for the other stages and checked against it.
sampling:
  x: [0.08, 0.88]
  y: [-0.42, 0.72]
  z: [-0.035, 0.825]

# Grasp-point boxes of the compartment interiors (0.04 m past the opening). Used by the test suites and the coverage strata.
compartments:
  - name: bottom
    x: [0.6, 0.86]
    y: [-0.21, 0.51]
    z: [-0.035, 0.24625]
  - name: middle
    x: [0.6, 0.86]
    y: [-0.21, 0.51]
    z: [0.26625, 0.52875]
  - name: top
    x: [0.6, 0.86]
    y: [-0.21, 0.51]
    z: [0.54875, 0.805]

# Derivation (make_scenes.py); not read by the runtime.
variant:
  base: cabinet.yml
  clearance_scale: 1.25
  width_scale: 2.0
  height_scale: 1.25
  centre_y: 0.15
  rule: each compartment opening width_scale x as wide and each compartment height_scale x as tall, cupboard centred on y = centre_y; panels, floor, back face and depth unchanged
