# Frozen600 no-wall scene plus one 0.80 m tall wall centred in the transition band.
# Wall: 0.40 (x) x 0.05 (y) x 0.80 (z) m, centre (0.57, 0.0, 0.365); stands on the table top
# (z = -0.035) and reaches z = 0.765. Zones, task axes and sampling are unchanged.

cuboids:
  - name: table
    pose: [0.65, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
    dims: [0.80, 1.20, 0.05]

  - name: transition_wall
    pose: [0.57, 0.0, 0.365, 1.0, 0.0, 0.0, 0.0]
    dims: [0.40, 0.05, 0.80]

viz_table:
  name: viz_tabletop
  pose: [0.75, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
  dims: [1.00, 1.20, 0.05]

sampling:
  x: [0.29, 0.85]
  y: [-0.55, 0.55]

zones:
  type: corner_table
  layout: y_split
  y_divide: 0.0
  overlap: 0.10
  x_center: 0.75
  cup_side: 1
  cup_region:
    label: CUPPING LEFT (+Y) — NO WALL
    x: [0.29, 0.85]
    y: [0.10, 0.55]
  pour_region:
    label: POURING RIGHT (-Y) — CLEAR
    x: [0.29, 0.85]
    y: [-0.55, -0.10]
  overlap_region:
    label: TRANSITION (2x WIDE) — 80 CM WALL
    x: [0.29, 0.85]
    y: [-0.10, 0.10]

task_axes:
  cup:
    local_axis: [-1.0, 0.0, 0.0]
    world_axis: [0.0, 0.0, 1.0]
  pour:
    local_axis: [0.0, 0.0, 1.0]
    world_axis: [1.0, 0.0, 0.0]
