# UR5e rectangular tabletop scene: cupping on the robot's left, pouring on
# the robot's right. NO obstacle — the 0.25 m `cup_left_wall` of
# scene_ur5e_tabletop_wall25.yml has been removed, so the cupping half is as
# clear as the pouring half. The table remains (support surface + z-floor).
# The transition band is DOUBLED in y: +-0.10 m instead of +-0.05 m.
# Pose: [x, y, z, qw, qx, qy, qz]; dims: full [dx, dy, dz].

cuboids:
  - name: table
    pose: [0.65, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
    dims: [0.80, 1.20, 0.05]

viz_table:
  name: viz_tabletop
  pose: [0.75, 0.0, -0.06, 1.0, 0.0, 0.0, 0.0]
  dims: [1.00, 1.20, 0.05]

sampling:
  x: [0.29, 0.85]
  y: [-0.55, 0.55]

zones:
  type: corner_table
  layout: y_split
  y_divide: 0.0
  overlap: 0.10
  x_center: 0.75
  cup_side: 1
  cup_region:
    label: CUPPING LEFT (+Y) — NO WALL
    x: [0.29, 0.85]
    y: [0.10, 0.55]
  pour_region:
    label: POURING RIGHT (-Y) — CLEAR
    x: [0.29, 0.85]
    y: [-0.55, -0.10]
  overlap_region:
    label: TRANSITION (2x WIDE)
    x: [0.29, 0.85]
    y: [-0.10, 0.10]

task_axes:
  cup:
    local_axis: [-1.0, 0.0, 0.0]
    world_axis: [0.0, 0.0, 1.0]
  pour:
    local_axis: [0.0, 0.0, 1.0]
    world_axis: [1.0, 0.0, 0.0]
