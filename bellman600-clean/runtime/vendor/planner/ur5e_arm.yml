# cuRobo Robot Config — UR5e + Robotiq 2F-140 gripper (6-DOF arm; finger_joint locked)
robot_cfg:
  kinematics:
    urdf_path: /opt/ur5e_description/ur5e_robotiq_2f_140.urdf
    asset_root_path: /opt/ur5e_description/

    base_link: base_link
    ee_link: grasp_frame
    lock_joints: {finger_joint: 0.0}

    collision_link_names:
      # 6 arm links + tool0 + robotiq base + 10 finger links = 18 total
      - shoulder_link
      - upper_arm_link
      - forearm_link
      - wrist_1_link
      - wrist_2_link
      - wrist_3_link
      - tool0
      - robotiq_arg2f_base_link
      - left_outer_knuckle
      - left_inner_knuckle
      - left_outer_finger
      - left_inner_finger
      - left_inner_finger_pad
      - right_outer_knuckle
      - right_inner_knuckle
      - right_outer_finger
      - right_inner_finger
      - right_inner_finger_pad

    collision_spheres: "/workspace/spheres_ur5e_arm.yml"
    collision_sphere_buffer: 0.005

    self_collision_ignore:
      upper_arm_link: [forearm_link, shoulder_link]
      forearm_link: [wrist_1_link, wrist_2_link, wrist_3_link]
      wrist_1_link: [wrist_2_link, wrist_3_link, tool0, robotiq_arg2f_base_link]
      # Same omission as wrist_3_link below: wrist_2 already ignores tool0 and the
      # gripper base, but the finger links were never listed. wrist_3's rotation only
      # spins the gripper about the tool axis, so wrist_2 <-> finger distance is
      # effectively fixed (measured std 0.00011 m over 40k configs) and pinned d_self
      # for 73% of configs once the wrist_3 pairs were ignored.
      wrist_2_link: [wrist_3_link, tool0, robotiq_arg2f_base_link,
                     left_outer_finger, left_inner_finger_pad,
                     left_inner_knuckle, left_inner_finger, left_outer_knuckle,
                     right_outer_finger, right_inner_finger_pad,
                     right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      # wrist_3_link carries the gripper: the Robotiq base and all finger links are
      # rigidly mounted on it and the fingers are not actuated here, so these pairs
      # are at a FIXED separation and can never signal a real self-collision.
      # Measured 2026-08-31: wrist_3_link <-> left_outer_finger sat at exactly
      # 0.0280 m (std 0.00000) and was the global minimum for 95.5% of configs,
      # pinning d_self and flattening the whole speed field.
      wrist_3_link: [tool0, robotiq_arg2f_base_link,
                     left_outer_finger, left_inner_finger_pad,
                     left_inner_knuckle, left_inner_finger, left_outer_knuckle,
                     right_outer_finger, right_inner_finger_pad,
                     right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      tool0: [robotiq_arg2f_base_link, left_outer_finger, left_inner_finger_pad,
              left_inner_knuckle, left_inner_finger, left_outer_knuckle,
              right_outer_finger, right_inner_finger_pad,
              right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      robotiq_arg2f_base_link: [left_outer_finger, left_inner_finger_pad,
                                left_inner_knuckle, left_inner_finger, left_outer_knuckle,
                                right_outer_finger, right_inner_finger_pad,
                                right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      left_outer_finger: [left_inner_finger_pad,
                          left_inner_knuckle, left_inner_finger, left_outer_knuckle,
                          right_outer_finger, right_inner_finger_pad,
                          right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      left_inner_finger_pad: [left_inner_knuckle, left_inner_finger, left_outer_knuckle,
                              right_outer_finger, right_inner_finger_pad,
                              right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      left_inner_knuckle: [left_inner_finger, left_outer_knuckle,
                           right_outer_finger, right_inner_finger_pad,
                           right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      left_inner_finger: [left_outer_knuckle,
                          right_outer_finger, right_inner_finger_pad,
                          right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      left_outer_knuckle: [right_outer_finger, right_inner_finger_pad,
                           right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      right_outer_finger: [right_inner_finger_pad,
                           right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      right_inner_finger_pad: [right_inner_knuckle, right_inner_finger, right_outer_knuckle]
      right_inner_knuckle: [right_inner_finger, right_outer_knuckle]
      right_inner_finger: [right_outer_knuckle]

    self_collision_buffer:
      shoulder_link: 0.01
      upper_arm_link: 0.0
      forearm_link: 0.0
      wrist_1_link: 0.0
      wrist_2_link: 0.0
      wrist_3_link: 0.0
      tool0: 0.02
      robotiq_arg2f_base_link: 0.0
      left_outer_knuckle: 0.0
      left_inner_knuckle: 0.0
      left_outer_finger: 0.0
      left_inner_finger: 0.0
      left_inner_finger_pad: 0.0
      right_outer_knuckle: 0.0
      right_inner_knuckle: 0.0
      right_outer_finger: 0.0
      right_inner_finger: 0.0
      right_inner_finger_pad: 0.0

    cspace:
      joint_names:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
      retract_config: [0.0, -2.2, 1.9, -1.383, -1.57, 0.0]
      null_space_weight: [1, 1, 1, 1, 1, 1]
      cspace_distance_weight: [1, 1, 1, 1, 1, 1]
      max_jerk: 500.0
      max_acceleration: 15.0
