# real_world_12dof: two UR5e arms (12 joints: left q[0:6], right q[6:12]) side by side in front of the measured cupboard, symmetric
# about its width centre. Written by jeffrey/real_world/make_scenes.py; do not edit by hand.
# Cupboard (measured): outer box 1.82 m tall x 0.56 m deep x 0.92 m wide, panels included; top and bottom
# 0.08 m metal, sides 0.03 m, back 0.03 m, two dividers 0.03 m (thickness ASSUMED, not measured)
# evenly spaced: three zones 0.5333 m tall, 0.53 m deep, 0.86 m wide inside.
# Open towards the robot (-x). Standing on the floor; each robot on a 0.25 x 0.25 m pedestal, base_link z = 0 = pedestal top.
# Arm model: the release UR5e + Robotiq 2F-140, cuRobo spheres (jeffrey/real_world/robot.py).
# Frame: midway between the two bases, x towards the cupboard, z up. Bases at y = +-0.30 (left = +y), both facing +x.
# Floor z = -0.60 (bases 0.60 m above the floor); cupboard front face x = 0.25, back face x = 0.81, y -0.46 to
# 0.46, z -0.60 to 1.22.
# Placement: largest mean reached share of the zone interiors by either arm (the other at home, straight up) over a grid of base height 0.6-1.1 m (0.1 m steps) and front-face distance 0.15-0.75 m
# and half spacing 0.20-0.46 m. Reached by either arm: bottom 83 %, middle 86 %, top 78 %.
# Validity: each arm against the cuboids (>= 0.005 m) and itself (>= 0.002 m); the two arms against each other (>= 0.005 m, all spheres).

