# real_world_6dof: one UR5e (6 joints) in front of the measured cupboard. Written by jeffrey/real_world/make_scenes.py; do not edit by hand.
# Cupboard (measured): outer box 1.82 m tall x 0.56 m deep x 0.92 m wide, panels included; top and bottom
# 0.08 m metal, sides 0.03 m, back 0.03 m, two dividers 0.03 m (thickness ASSUMED, not measured)
# evenly spaced: three zones 0.5333 m tall, 0.53 m deep, 0.86 m wide inside.
# Open towards the robot (-x). Standing on the floor; each robot on a 0.25 x 0.25 m pedestal, base_link z = 0 = pedestal top.
# Arm model: the release UR5e + Robotiq 2F-140, cuRobo spheres (jeffrey/real_world/robot.py).
# Frame: robot base_link at the origin, x towards the cupboard, z up. Floor z = -0.70 (base 0.70 m above the floor); cupboard front face
# x = 0.45, back face x = 1.01, y -0.46 to 0.46, z -0.70 to 1.12.
# Placement: largest mean reached share of the zone interiors over a grid of base height 0.6-1.1 m (0.1 m steps) and front-face distance 0.15-0.75 m (make_scenes.py:
# valid configurations, any gripper orientation, 4 cm voxels). Reached: bottom 79 %, middle 85 %, top 73 %.
# compartments: zone interiors from 0.04 m inside the opening (the cabinet scenes' convention); interiors: the full zone interiors.
# sampling: the cabinet scenes' grasp-point box rule (height = cupboard, width 1.5 x, depth 2.5 x from the back face, x >= 0.08).

