<title><!--TITLE--></title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--CSS-->
<div class="page">
<!--BODY-->
</div>
<script>
(() => {
  const D = /*DATA*/;
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const h = (t, c, txt, p) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; if (p) p.appendChild(e); return e; };
  const place = (tip, p, ev) => { const pr = p.getBoundingClientRect(); let left = ev.clientX - pr.left + 14;
    if (left + tip.offsetWidth > pr.width - 4) left = ev.clientX - pr.left - tip.offsetWidth - 14;
    tip.style.left = `${Math.max(4, left)}px`; tip.style.top = `${Math.max(4, ev.clientY - pr.top - 20)}px`; };
  const showTip = (tip, p, ev, head, rows) => { tip.textContent = ''; h('div', 'h', head, tip); rows.forEach(([a, b]) => { const r = h('div', 'r', null, tip); h('span', null, '', r); h('i', null, a, r); h('b', null, b, r); }); tip.hidden = false; place(tip, p, ev); };

  // dot plot: P = {title, sub, xmin, xmax, ticks, xlabel, legend: [[label, css]], refs: [{x, label}], groups: [{name, rows: [{name, key, dots: [{x, css, label, value}], span: [lo, hi]}]}]}
  const dotPanel = (P, boxId) => {
    const box = document.getElementById(boxId); if (!box || !P) return;
    const p = h('div', 'panel', null, box); p.style.paddingBottom = '10px';
    const h4 = h('h4', null, P.title, p); h('span', null, P.sub, h4);
    const leg = h('div', 'dlegend', null, p);
    (P.legend || []).forEach(([a, css]) => { const s = h('span', null, null, leg); const k = h('i', null, null, s); k.style.background = `var(${css})`; s.append(a); });
    (P.refs || []).forEach(r => { const s = h('span', null, null, leg); h('i', 'dash', null, s); s.append(r.label); });
    const X = v => `${Math.max(0, Math.min(100, (v - P.xmin) / (P.xmax - P.xmin) * 100))}%`;
    const tip = h('div', 'tip', null, p); tip.hidden = true;
    const wrap = h('div', 'dots', null, p);
    P.groups.forEach(g => {
      if (g.name) h('div', 'dgroup', g.name, wrap);
      g.rows.forEach(r => {
        const row = h('div', 'drow', null, wrap);
        h('div', r.key ? 'dlab key2' : 'dlab', r.name, row);
        const t = h('div', 'track', null, row);
        (P.refs || []).forEach(q => { const e = h('div', 'ref', null, t); e.style.left = X(q.x); });
        if (r.span) { const b = h('div', 'bar', null, t); b.style.left = X(r.span[0]); b.style.width = `calc(${X(r.span[1])} - ${X(r.span[0])})`; }
        r.dots.forEach(d => { const e = h('div', 'dot', null, t); e.style.left = X(d.x); e.style.background = `var(${d.css})`; });
        const show = ev => showTip(tip, p, ev, r.name, r.dots.map(d => [d.label, d.value]));
        row.addEventListener('pointermove', show); row.addEventListener('pointerdown', show); row.addEventListener('pointerleave', () => { tip.hidden = true; });
      });
    });
    const sc = h('div', 'dscale', null, p); h('div', 'mute', P.xlabel, sc);
    const tk = h('div', 'ticks', null, sc); P.ticks.forEach(v => { const s = h('span', null, String(v), tk); s.style.left = X(v); });
  };

  const scatterPanel = (SD, boxId) => {
    const box = document.getElementById(boxId); if (!box || !SD) return;
    const p = h('div', 'panel', null, box);
    const h4 = h('h4', null, SD.title, p); h('span', null, SD.sub, h4);
    const W = 420, H = 250, L = 38, R = 12, T = 12, B = 40;
    const svg = mk('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${SD.title}: ${SD.sub}`}, p);
    const X = v => L + (v - SD.xmin) / (SD.xmax - SD.xmin) * (W - L - R), Y = v => T + (1 - (v - SD.ymin) / (SD.ymax - SD.ymin)) * (H - T - B);
    const ax = mk('g', {class: 'axis'}, svg);
    SD.yticks.forEach(v => { mk('line', {x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: 'gridline'}, svg); mk('text', {x: L - 6, y: Y(v) + 3, 'text-anchor': 'end'}, ax).textContent = v; });
    SD.xticks.forEach(v => { mk('text', {x: X(v), y: H - B + 14, 'text-anchor': 'middle'}, ax).textContent = v; });
    mk('text', {x: (L + W - R) / 2, y: H - 6, 'text-anchor': 'middle', class: 'lab'}, ax).textContent = SD.xlabel;
    const tip = h('div', 'tip', null, p); tip.hidden = true;
    SD.points.forEach(q => { mk('circle', {cx: X(q.x), cy: Y(q.y), r: 4.5, fill: `var(${q.css})`, stroke: 'var(--surface)', 'stroke-width': 2}, svg); });
    SD.points.forEach(q => {
      const hit = mk('circle', {cx: X(q.x), cy: Y(q.y), r: 11, fill: 'transparent', style: 'touch-action: pan-y'}, svg);
      const show = ev => showTip(tip, p, ev, q.name, q.text);
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', () => { tip.hidden = true; });
    });
  };

  // line panel: LP = {title, sub, xs, xlabel, ymax, yticks, series: [{name, css, dash, values}]}
  const linePanel = (LP, boxId) => {
    const box = document.getElementById(boxId); if (!box || !LP) return;
    const p = h('div', 'panel', null, box);
    const h4 = h('h4', null, LP.title, p); h('span', null, LP.sub, h4);
    const leg = h('div', 'dlegend', null, p);
    LP.series.forEach(s => { const c = h('span', null, null, leg); const k = h('i', null, null, c); k.style.background = `var(${s.css})`; c.append(s.name); });
    const W = 420, H = 230, L = 34, R = 12, T = 10, B = 34;
    const svg = mk('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${LP.title}: ${LP.sub}`}, p);
    const X = i => L + i / (LP.xs.length - 1) * (W - L - R), Y = v => T + (1 - v / LP.ymax) * (H - T - B);
    const ax = mk('g', {class: 'axis'}, svg);
    LP.yticks.forEach(v => { mk('line', {x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: 'gridline'}, svg); mk('text', {x: L - 6, y: Y(v) + 3, 'text-anchor': 'end'}, ax).textContent = v; });
    LP.xs.forEach((v, i) => { mk('text', {x: X(i), y: H - B + 14, 'text-anchor': 'middle'}, ax).textContent = v; });
    mk('text', {x: (L + W - R) / 2, y: H - 4, 'text-anchor': 'middle', class: 'lab'}, ax).textContent = LP.xlabel;
    const tip = h('div', 'tip', null, p); tip.hidden = true;
    LP.series.forEach(s => {
      const pts = s.values.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
      mk('polyline', {points: pts.map(q => q.join(',')).join(' '), fill: 'none', stroke: `var(${s.css})`, 'stroke-width': 2}, svg);
      pts.forEach(q => mk('circle', {cx: q[0], cy: q[1], r: 4, fill: `var(${s.css})`, stroke: 'var(--surface)', 'stroke-width': 2}, svg));
    });
    LP.xs.forEach((x, i) => {
      const hit = mk('rect', {x: X(i) - 20, y: T, width: 40, height: H - T - B, fill: 'transparent', style: 'touch-action: pan-y'}, svg);
      const show = ev => showTip(tip, p, ev, `${LP.xlabel}: ${x}`, LP.series.filter(s => s.values[i] != null).map(s => [s.name, s.values[i].toFixed(2)]));
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', () => { tip.hidden = true; });
    });
  };
  Object.entries(D.dots).forEach(([id, ps]) => ps.forEach(P => dotPanel(P, id)));
  Object.entries(D.scatter).forEach(([id, ps]) => ps.forEach(P => scatterPanel(P, id)));
  Object.entries(D.lines).forEach(([id, ps]) => ps.forEach(P => linePanel(P, id)));
})();
</script>
